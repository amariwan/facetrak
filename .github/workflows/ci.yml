name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
            dev-only: true
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-22.04
            python: "3.12"
          # ARM64 production arch (Pi 4/5 class); runs only when available.
          - os: ubuntu-24.04-arm
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (headless OpenCV on Linux)
        run: |
          pip install -e . --no-deps
          pip install mediapipe pytest httpx ruff
          if [ "$RUNNER_OS" = "Linux" ]; then pip install --force-reinstall --no-deps opencv-contrib-python-headless; fi
      - name: Lint
        run: ruff check facetrak tests scripts || true
      - name: Tests (mocked, no hardware)
        run: python -m pytest tests/ -q
      - name: Headless smoke (no camera)
        run: python -m facetrak.servers.headless --check
      - name: Benchmark smoke
        run: python scripts/benchmark.py --frames 50
      - name: Secret scan (tracked files)
        run: |
          ! grep -rEi "api[_-]?key|passwd|pwd\s*=|BEGIN .*PRIVATE KEY" \
            --include="*.py" --include="*.json" --include="*.yml" \
            --exclude-dir=.venv --exclude-dir=.git . \
            | grep -viE "password.*\"\".*|auth_token.*\"\"" || true

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image amd64 (no push)
        run: docker build -t facetrak:ci-amd64 --platform linux/amd64 .
      - name: Image smoke amd64 (check + import)
        run: |
          docker run --rm facetrak:ci-amd64 python -m facetrak.servers.headless --check
      - name: Build production image arm64 (no push)
        run: docker build -t facetrak:ci-arm64 --platform linux/arm64 .
      - name: Image smoke arm64 (import + headless check)
        run: |
          docker run --rm facetrak:ci-arm64 python -m facetrak.servers.headless --check
          docker run --rm facetrak:ci-arm64 sh -c "pip install -q pytest httpx && python -m pytest tests/test_platform.py tests/test_headless.py -q"

  systemd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify unit file syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq systemd
          sudo mkdir -p /opt/facetrak/.venv/bin
          sudo ln -sf /usr/bin/python3 /opt/facetrak/.venv/bin/python
          sudo systemd-analyze verify $PWD/deploy/facetrak.service

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install
        run: npm ci --prefix web
      - name: Typecheck
        run: npx --prefix web tsc --noEmit
      - name: Component tests
        run: npm test --prefix web
      - name: Build
        run: npm run build --prefix web

  api-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (headless OpenCV on Linux)
        run: |
          pip install -e . --no-deps
          pip install mediapipe pytest httpx fastapi uvicorn
          pip install --force-reinstall --no-deps opencv-contrib-python-headless
      - name: API v1 smoke
        run: python -m pytest tests/test_api_v1.py tests/test_rest_api.py -q
      - name: Simulation tests (virtual cameras, replay, rules)
        run: python -m pytest tests/test_facetrak1.py -q
      - name: Dependency audit
        run: pip audit || echo "pip-audit not installed; manual review required"
